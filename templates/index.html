{% extends "base.html" %}
{% block content %}
  <p><a href="{{ url_for('add') }}">+ Agregar contacto</a></p>

  <table border="1" cellpadding="6">
    <tr>
      <th>Nombre</th><th>Teléfono</th><th>Email</th><th>Notas</th><th>Acciones</th>
    </tr>
    {% for c in contactos %}
    <tr>
      <td>{{ c.nombre }}</td>
      <td>{{ c.telefono }}</td>
      <td>{{ c.email }}</td>
      <td>{{ c.notas }}</td>
      <td>
        <a href="{{ url_for('edit', contacto_id=c.id) }}">Editar</a>
        &nbsp;
        <form action="{{ url_for('delete', contacto_id=c.id) }}" method="post" style="display:inline">
          <button type="submit" onclick="return confirm('¿Eliminar este contacto?')">Eliminar</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
