# Ejecuta la aplicación usando la imagen PUBLICADA en GHCR (no construye nada).
# Uso:  docker compose -f docker-compose.ghcr.yml up -d
services:
  web:
    image: ghcr.io/tatiana0628/agenda-contactos:latest
    container_name: agenda_web_ghcr
    ports:
      - "8080:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-agenda}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agenda_net

  db:
    image: postgres:16
    container_name: agenda_db_ghcr
    environment:
      POSTGRES_DB: ${DB_NAME:-agenda}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - agenda_data_ghcr:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agenda_net

networks:
  agenda_net:

volumes:
  agenda_data_ghcr:
